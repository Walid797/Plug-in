name: Windows installer (exe)
# Push a tag such as v1.0.1 (or run it by hand): builds the web app, packs it with Electron into an NSIS installer
# and attaches Hoshmand-Photo-Studio-Setup-<version>.exe + latest.yml to a GitHub Release. Installed apps pick the new
# release up through latest.yml (the optional, photo-free update check).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the web app
        run: |
          npm ci
          node tools/build.mjs
      - name: Set the installer version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: cd desktop && npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Build the installer
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then npm run dist:publish; else npm run dist; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Hoshmand-Photo-Studio-Setup
          path: desktop/dist/*.exe
